quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.show-logs=true

quarkus.flyway.enabled=true
quarkus.flyway.clean-at-start=true
quarkus.flyway.migrate-at-start=true

quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=

# How to configure the session and cookie timeout
# Session dies after 30 mins of inactivity
quarkus.http.auth.form.timeout=30m

# Cookie is session-only (deleted on browser close)
quarkus.http.auth.form.cookie-max-age=0

# But while active, refresh cookie every 1 min
quarkus.http.auth.form.new-cookie-interval=30s

#Result:
# User can work for hours ? no re-login.
# Close browser ? must log in again.
# Idle for 30 mins ? session gone.

# Rule of thumb: new-cookie-interval ? cookie-max-age ? timeout

quarkus.http.auth.session.encryption-key=6eVDawqACoHK4XCGykvrBN9vvabWuT5D

# For server side logout
quarkus.http.auth.form.http-only-cookie=true
