# CORS Settings
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8080
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Reactive Data Source
quarkus.datasource.devservices.show-logs=true
quarkus.datasource.db-kind=postgresql

# Only for Flyway
quarkus.flyway.enabled=true
quarkus.flyway.clean-at-start=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.sql-migration-prefix=V

# Form Based Auth Settings
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=

# How to configure the session and cookie timeout
# Session dies after 30 mins of inactivity
quarkus.http.auth.form.timeout=30m

#quarkus.http.auth.form.cookie-max-age=PT1H
quarkus.http.auth.form.cookie-same-site=Lax

# But while active, refresh cookie every 30 secs
quarkus.http.auth.form.new-cookie-interval=30s

quarkus.http.auth.session.encryption-key=6eVDawqACoHK4XCGykvrBN9vvabWuT5D

# For server side logout
quarkus.http.auth.form.http-only-cookie=true
