<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalistic Login Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm" action="/login">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
            <div id="usernameError" class="error">Please enter a username.</div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <div id="passwordError" class="error">Please enter a password.</div>
        </div>
        <button type="submit">Sign In</button>
    </form>
</div>

<script type="application/javascript" src="script/app-constants.js"></script>
<script type="application/javascript" src="script/rest-util.js"></script>
<script type="application/javascript" src="script/home.js"></script>
</body>
</html>
